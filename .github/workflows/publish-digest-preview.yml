name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Marker for the preview banner; leave empty to publish the clean copy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANE_MARKER: ${{ inputs.lane_marker }}
      PORT: '8787'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm exec --yes --package=pnpm@10.34.9 -- pnpm install --lockfile=false

      - name: Render the digest as one HTML file
        run: |
          set -euo pipefail
          npm exec --yes --package=pnpm@10.34.9 -- pnpm start >/tmp/rig.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p _site
          curl --fail --silent --show-error \
            http://127.0.0.1:8787/digest/2026-10-28 \
            --output _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
